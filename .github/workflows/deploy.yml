name: Flask CI/CD

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI: Test the application
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -c "import app; print('Flask app imported successfully')"
          python -m pytest


  # =========================
  # CD: Deploy to AWS EC2
  # =========================
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy application files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.py,requirements.txt"
          target: "/opt/flask-cicd"

      - name: Install dependencies and restart Flask
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/flask-cicd

            /opt/flask-cicd/venv/bin/pip install -r requirements.txt

            sudo systemctl restart flask-cicd

            sudo systemctl status flask-cicd --no-pager